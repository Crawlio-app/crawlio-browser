<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <img src="icon32.png" class="popup-logo" alt="">
      <span class="popup-title">Crawlio</span>
      <a id="help-link" class="help-link" href="https://docs.crawlio.app/browser-agent/overview" target="_blank" title="Help">?</a>
    </div>
    <div class="popup-body">
      <div class="status-row">
        <span class="status-dot"></span>
        <span id="status-label" class="status-label"></span>
      </div>

      <div class="access-row">
        <span class="access-title">Browser access</span>
        <span id="access-status" class="access-status">Checking…</span>
      </div>

      <div id="waiting-card" class="waiting-card" style="display:none">
        <span class="waiting-dot"></span>
        <span class="waiting-text">Waiting for an MCP server…</span>
      </div>
      <button id="reconnect-btn" class="reconnect-link" style="display:none">Reconnect</button>
      <button id="disconnect-btn" class="btn btn-disconnect" style="display:none">Disconnect MCP</button>
      <button id="setup-btn" class="setup-link" style="display:none">Complete onboarding</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
