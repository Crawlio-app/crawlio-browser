name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 5 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Code scanning needs GitHub Advanced Security, which public repositories get for free and
    # this private one does not have. Without the gate the job fails on every push to the
    # source repository -- and a check that is always red is a check nobody reads. This file is
    # copied verbatim to the public mirror, where the condition holds and the analysis runs.
    if: github.repository == 'Crawlio-app/crawlio-browser'
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
