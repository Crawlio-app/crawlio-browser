name: Bug report
description: Something in the MCP server or the Chrome extension is not working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this form for security
        vulnerabilities — follow the private process in SECURITY.md instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
      placeholder: Calling detect_tables on https://example.com returns an empty array, but the page has a table.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A URL and the exact tool calls help enormously.
      placeholder: |
        1. Connect to a tab on https://…
        2. Call `detect_tables`
        3. See empty result
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: crawlio-browser version
      description: "Output of: npx crawlio-browser --version"
      placeholder: "1.8.0"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: From chrome://extensions (or "not installed")
      placeholder: "1.8.0"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Code / Claude Desktop / Cursor / other"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and Chrome version
      placeholder: "macOS 15.3, Chrome 133"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: "Output of: npx crawlio-browser doctor --json (redact anything sensitive)"
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Service worker console output from chrome://extensions, or MCP client logs.
      render: shell
